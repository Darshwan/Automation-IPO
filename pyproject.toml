[project]
name = "automation-ipo"
version = "0.1.0"
description = "MVP automation pipeline for IPO detection and application workflows"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
]

[project.scripts]
automation-ipo = "automation_ipo.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
